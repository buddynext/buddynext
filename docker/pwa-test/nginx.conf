# Reverse-proxies a Local-by-Flywheel (or any) WordPress site onto 127.0.0.1 so
# service workers actually run against it. See README.md for why this is needed.

server {
    listen 8080;
    server_name localhost 127.0.0.1;

    # The proxied site's absolute URLs point at its own host. Rewrite them to the
    # proxy origin so the page, its assets and the worker all stay on ONE origin —
    # a service worker cannot control a scope on a different origin, so without
    # this the worker would never take control and the test would silently pass.
    sub_filter_types text/html text/css application/javascript application/json;
    sub_filter_once off;
    sub_filter "http://$SITE_HOST"  "http://127.0.0.1:$PROXY_PORT";
    sub_filter "https://$SITE_HOST" "http://127.0.0.1:$PROXY_PORT";
    sub_filter "$SITE_HOST"         "127.0.0.1:$PROXY_PORT";

    location / {
        proxy_pass http://host.docker.internal;
        proxy_set_header Host $SITE_HOST;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # sub_filter cannot rewrite a compressed body, and the upstream will
        # happily gzip if asked. Ask for identity instead.
        proxy_set_header Accept-Encoding "";

        # Follow the site's own redirects back onto the proxy origin rather than
        # bouncing the browser off to the real host mid-test.
        proxy_redirect http://$SITE_HOST/  http://127.0.0.1:$PROXY_PORT/;
        proxy_redirect https://$SITE_HOST/ http://127.0.0.1:$PROXY_PORT/;

        # The worker is served from /wp-json/… but must control the whole site.
        # nginx must not strip the header that allows that wider scope.
        proxy_pass_header Service-Worker-Allowed;

        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
