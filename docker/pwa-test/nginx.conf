# Reverse-proxies a Local-by-Flywheel (or any) WordPress site onto an origin where
# service workers actually run. See README.md for why this is needed.
#
# PUBLIC_ORIGIN is what the site's own absolute URLs get rewritten to:
#   loopback mode : http://127.0.0.1:8080   (secure context, no certificates)
#   tunnel mode   : https://<name>.trycloudflare.com (real TLS, real devices)

server {
    listen 8080;
    server_name localhost 127.0.0.1;

    # The proxied site's absolute URLs point at its own host. Rewrite them to the
    # origin the browser is actually using, so the page, its assets and the worker
    # all stay on ONE origin — a service worker cannot control a scope on a
    # different origin, so without this the worker never takes control and the
    # test passes while proving nothing.
    # application/manifest+json is easy to miss and matters most: the manifest
    # carries start_url and scope, and if those keep pointing at the real host the
    # install prompt never appears (or installs an app that opens the wrong site).
    sub_filter_types text/html text/css application/javascript application/json
                     application/manifest+json text/javascript;
    sub_filter_once off;
    sub_filter "http://$SITE_HOST"  "$PUBLIC_ORIGIN";
    sub_filter "https://$SITE_HOST" "$PUBLIC_ORIGIN";
    # Inline scripts carry JSON-encoded URLs, where every slash is escaped
    # ("http:\/\/host\/path"). Those do not match the rules above, so a handful of
    # absolute URLs would survive and point the browser back at the real host —
    # off-origin, where the worker has no control.
    sub_filter "http:\/\/$SITE_HOST"  "$PUBLIC_ORIGIN_ESCAPED";
    sub_filter "https:\/\/$SITE_HOST" "$PUBLIC_ORIGIN_ESCAPED";

    location / {
        proxy_pass http://host.docker.internal;
        proxy_set_header Host $SITE_HOST;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # sub_filter cannot rewrite a compressed body, and the upstream will
        # happily gzip if asked. Ask for identity instead.
        proxy_set_header Accept-Encoding "";

        # Follow the site's own redirects back onto this origin rather than
        # bouncing the browser off to the real host mid-test.
        proxy_redirect http://$SITE_HOST/  $PUBLIC_ORIGIN/;
        proxy_redirect https://$SITE_HOST/ $PUBLIC_ORIGIN/;

        # The worker is served from /wp-json/… but must control the whole site.
        # nginx must not strip the header that allows that wider scope.
        proxy_pass_header Service-Worker-Allowed;

        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
